<header class="header" [class.menu-open]="isMenuOpen">
  <div class="container">
    <nav class="navbar">
      <!-- Logo -->
      <div class="navbar-brand" aria-label="IA Insurance Agency">
        <a routerLink="/" class="logo">
          <img src="assets/logo.jpeg" alt="IA Insurance Agency" class="logo-image" loading="eager">
        </a>
      </div>

      <!-- Menu Toggle (Hamburger) -->
      <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Navigation Menu -->
      <ul class="navbar-menu" [class.active]="isMenuOpen">
        <li class="navbar-item">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
            Inicio
          </a>
        </li>
        <li class="navbar-item">
          <a routerLink="/nosotros" routerLinkActive="active" (click)="closeMenu()">
            Nosotros
          </a>
        </li>
        <li class="navbar-item">
          <a routerLink="/productos" routerLinkActive="active" (click)="closeMenu()">
            Productos
          </a>
        </li>
        <li class="navbar-item">
          <a routerLink="/contacto" routerLinkActive="active" (click)="closeMenu()">
            Contacto
          </a>
        </li>
        <li class="navbar-item navbar-cta">
          <a href="https://wa.me/573213252193" target="_blank" class="btn-header" (click)="closeMenu()">
            Solicitar propuesta
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
